  .badge {

  /* full-screen site viewer */
  .site-view {
    position: fixed; inset: 0; background: var(--bg); z-index: 50;
    display: flex; flex-direction: column;

  }
  .site-view.active { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
  .site-view .bar {
    display: flex; align-items: center; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
    background: var(--card); border-bottom: 1px solid var(--card-border); flex: none;

  .site-view .bar button {
    appearance: none; border: 1px solid var(--row-border); background: var(--row); color: var(--text);

    display: inline-flex; align-items: center; gap: 6px;
  }
  .site-view .bar .title { font-weight: 800; font-size: 14px; color: var(--muted); }
  .site-view iframe { flex: 1; width: 100%; border: 0; background: #fff; }
</style>

<script>
  var PACKS = [
    { id: "4", icon: "📂", name: "4 GB RAM", sensi: [
      ["DPI", "523", true], ["FIRE BUTTON", "47", true], ["GENERAL", "182", true], ["RED DOT", "0", true],
      ["2X SCOPE", "190", true], ["4X SCOPE", "200", true], ["SNIPER SCOPE", "195", true], ["FREE CAMERA BUTTON", "200", true]
    ]},
    { id: "6", icon: "📂", name: "6 GB RAM", sensi: [
      ["DPI", "480", true], ["FIRE BUTTON", "47", true], ["GENERAL", "175", true], ["RED DOT", "0", true],
      ["2X SCOPE", "178", true], ["4X SCOPE", "184", true], ["SNIPER SCOPE", "155", true], ["FREE CAMERA BUTTON", "170", true]
    ]},
    { id: "8", icon: "📂", name: "8 GB RAM", sensi: [
      ["DPI", "440", true], ["FIRE BUTTON", "53", true], ["GENERAL", "163", true], ["RED DOT", "0", true],
      ["2X SCOPE", "160", true], ["4X SCOPE", "134", true], ["SNIPER SCOPE", "135", true], ["FREE CAMERA BUTTON", "150", true]
    ]},
    { id: "12", icon: "📂", name: "12 GB RAM", sensi: [
      ["DPI", "NO", false], ["FIRE BUTTON", "53", true], ["GENERAL", "133", true], ["RED DOT", "0", true],
      ["2X SCOPE", "122", true], ["4X SCOPE", "110", true], ["SNIPER SCOPE", "80", true], ["FREE CAMERA BUTTON", "90", true]
    ]}
  ];

  var home = document.getElementById("home");
  var detail = document.getElementById("detail");
  var packsEl = document.getElementById("packs");
  var titleEl = document.getElementById("d-title");
  var boxEl = document.getElementById("d-box");

  PACKS.forEach(function (p) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "pack";
    b.setAttribute("data-id", p.id);
    var left = document.createElement("span");
    var n = document.createElement("span");
    n.className = "name";
    n.textContent = p.icon + " " + p.name.toUpperCase();
    left.appendChild(n);
    if (p.note) {
      var s = document.createElement("span");
      s.className = "sub";
      s.textContent = p.note;
      left.appendChild(s);
    }
    var t = document.createElement("span");
    t.className = "tag";
    t.textContent = "FREE";
    b.appendChild(left);
    b.appendChild(t);
    b.addEventListener("click", function () { open(p.id, true); });
    packsEl.appendChild(b);
  });

  function open(id, push) {
    var p = PACKS.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    titleEl.textContent = p.name;
    boxEl.textContent = "";
    p.sensi.forEach(function (r) {
      var row = document.createElement("div");
      row.className = "sensi-row";
      var k = document.createElement("span");
      k.className = "k";
      k.textContent = r[0];
      var v = document.createElement("span");
      v.className = "v";
      var num = document.createElement("span");
      num.className = r[2] ? "num" : "num no";
      num.textContent = r[1];
      var mark = document.createElement("span");
      mark.textContent = r[2] ? "✅" : "❌";
      v.appendChild(num);
      v.appendChild(mark);
      row.appendChild(k);
      row.appendChild(v);
      boxEl.appendChild(row);
    });
    home.hidden = true;
    detail.hidden = false;
    detail.classList.remove("view-in");
    void detail.offsetWidth;
    detail.classList.add("view-in");
    window.scrollTo(0, 0);
    if (push) { try { history.pushState({ pack: id }, ""); } catch (e) {} }
  }

  function close(fromPop) {
    detail.hidden = true;
    home.hidden = false;
    window.scrollTo(0, 0);
    if (!fromPop) { try { if (history.state && history.state.pack) history.back(); } catch (e) {} }
  }

  document.getElementById("back").addEventListener("click", function () { close(false); });
  window.addEventListener("popstate", function () { close(true); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !detail.hidden) close(false); });
</script>
</body>

<script>
  function decodeEntities(str) {
    var ta = document.createElement("textarea");
    ta.innerHTML = str;
    return ta.value;
  }

  var srcFree = decodeEntities(document.getElementById("src-free").value);
  var srcPaid = decodeEntities(document.getElementById("src-paid").value);

  var viewFree = document.getElementById("view-free");
  var viewPaid = document.getElementById("view-paid");
  var frameFree = document.getElementById("frame-free");
  var framePaid = document.getElementById("frame-paid");

  function openWithTap(btn, view, frame, src) {
    btn.classList.add("tapped");
    setTimeout(function () {
      btn.classList.remove("tapped");
      if (!frame.getAttribute("data-loaded")) {
        frame.srcdoc = src;
        frame.setAttribute("data-loaded", "1");
      }
      view.classList.add("active");
    }, 150);
  }

  document.getElementById("btn-free").addEventListener("click", function () {
    openWithTap(this, viewFree, frameFree, srcFree);
  });

  document.getElementById("btn-paid").addEventListener("click", function () {
    openWithTap(this, viewPaid, framePaid, srcPaid);
  });

  document.querySelectorAll("[data-close]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var key = btn.getAttribute("data-close");
      document.getElementById("view-" + key).classList.remove("active");
    });
  });
</script>
